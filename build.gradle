// TimelessTimer - a server-side timer / scheduled-command mod for Minecraft 1.20.1 Forge.

buildscript {
    repositories {
        maven { url = 'https://maven.minecraftforge.net/' }
        mavenCentral()
    }
}

plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[6.0.16,6.2)'
}

// Java 17 toolchain.
//
// ForgeGradle 6 for 1.20.1 compiles against Java 17. Which JDK that is gets decided in
// settings.gradle, which checks JAVA_HOME, the directory next to this repository and this project
// directory in turn; see the comments there and in gradle.properties.
java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
}

// Build output directory.
//
// ForgeGradle writes intermediate log files and its own repositories into the build directory while
// resolving dependencies, so that directory has to be writable by the process running Gradle. The
// standard project-local "build" directory is used whenever that is possible, which is the normal
// case; if it cannot be created (a locked-down workspace, for instance) the output goes to .build
// next to the project instead. Either way the path can be forced with -PbuildDir=<path>.
def configuredBuildDir = project.findProperty('buildDir') ?: (project.file('build').canWrite() ? 'build' : '../.build')
layout.buildDirectory.set(file(configuredBuildDir))

base {
    // The specification's game-directory layout names the artifact with its version, e.g.
    // TimelessTimer-0.0.1.jar, so the version is part of the archive name.
    archivesName = "${mod_id}-${mod_version}"
}

minecraft {
    mappings channel: mapping_channel, version: mapping_version

    // This property allows configuring Gradle's ProcessResources task(s) to run on IDE output locations before launching the game.
    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')

            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
            // TimelessTimer is a server-side mod: it does nothing on a client.
            // This run configuration exists only for convenience while developing.
        }

        server {
            args '--nogui'
        }
    }
}

// Include resources generated by data generators.
sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    // ForgeGradle adds the Forge maven and Maven Central automatically.
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
}

// Expand declared replace properties in the resource targets below.
tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [minecraft_version   : minecraft_version, minecraft_version_range: minecraft_version_range,
                             forge_version       : forge_version, forge_version_range: forge_version_range,
                             loader_version_range: loader_version_range,
                             mod_id              : mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
                             mod_authors         : mod_authors, mod_description: mod_description,]

    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes(["Specification-Title"     : mod_id,
                    "Specification-Vendor"    : mod_authors,
                    "Specification-Version"   : "1",
                    "Implementation-Title"    : project.name,
                    "Implementation-Version"  : project.jar.archiveVersion,
                    "Implementation-Vendor"   : mod_authors,
                    "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")])
    }

    // This is the preferred method to reobfuscate your jar file
    finalizedBy 'reobfJar'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}

// TimelessTimer bundles no nested jars, but ForgeGradle still adds a jarJar task and fails while
// preparing it: JarJar.writeMetadata() writes build/jarjar/jarJar/metadata.json without creating
// that directory first, so the build dies with a NoSuchFileException before compiling anything.
// The directory is therefore created up front; jarJar then runs normally (and is a no-op for a mod
// without JiJ dependencies).
gradle.projectsEvaluated {
    file("${buildDir}/jarjar/jarJar").mkdirs()
    file("${buildDir}/jarjar").mkdirs()
}
