name: build

# Verifies that a fresh clone builds without any local setup: the wrapper downloads Gradle, the
# foojay resolver provides the Java 17 toolchain (GitHub runners reach Adoptium fine), and
# ForgeGradle fetches the Minecraft/Forge artifacts.
on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build
        run: ./gradlew build --no-daemon --console=plain

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: timelesstimer-jar
          path: build/libs/*.jar
          if-no-files-found: error
